name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Enforce source policy
        run: python tools/check_control_flow_policy.py
      - name: Configure
        run: cmake -S . -B build -DSCENE_POLYTREE_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install package chain
        run: cmake --install build --config Release --prefix "${{ github.workspace }}/install"
      - name: Configure installed consumer
        run: cmake -S tests/consumer -B consumer-build -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install"
      - name: Build installed consumer
        run: cmake --build consumer-build --config Release
      - name: Run installed consumer
        run: ctest --test-dir consumer-build -C Release --output-on-failure
